global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_name: 'host'

  - job_name: 'docker'
    static_configs:
      - targets: ['telegraf:9273']

  - job_name: 'tailscaled'
    static_configs:
      - targets: ['<tailscale-ip>:<metrics-port>']
        labels:
          tailscale_machine: '<hostname>'
